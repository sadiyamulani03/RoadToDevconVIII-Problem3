[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Allow tests to read the single source of truth (shared/level.json) and
# verify generated artifacts without ffi.
fs_permissions = [
    { access = "read", path = "./shared" },
    { access = "read", path = "./src" },
    { access = "read", path = "./frontend" },
]

# Keep the suite fast while still meaningful: 128 fuzz cases / 16x16 invariant runs.
fuzz = { runs = 128 }
invariant = { runs = 16, depth = 16, fail_on_revert = true }

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "preserve"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
# Generated artifacts are byte-compared by `npm run check:*` — never reformat.
ignore = ["test/generated"]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
